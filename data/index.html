<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 WebServer</title>
    <link rel="stylesheet" type="text/css" href="novo_estilo.css">
    <meta http-equiv="refresh" content="5">
</head>

<body>
    <header> <img src="temp.png"> </header>
    <h1>ESP32 Servidor Web</h1>

    <p>
    <form action="/relay/toggle" method="POST"><button class="button button1">%RELAY_ACTION%</button></form>
    </p>
    <p class="sensor-labels">Rele: <b>%RELAY_STATUS%</b></p>
    <p class="sensor-labels">COa2: <b>%GAS%</b></p>
    <p class="sensor-labels">Altitude: <b>%ALT%</b></p>
    <p class="sensor-labels">Pressao: <b>%PRESS%</b></p>
    <p class="sensor-labels">Fan: <b>%FAN_STATUS%</b></p>
    <p class="sensor-labels">Temperaturae: <b>%TEMP%</b></p>
    <p class="sensor-labels">Umidade: <b> %HUM% </b></p>
    <footer><img src="temp_co.png"></footer>
</body>

</html>
